services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-eventos_db}
      MYSQL_USER: ${DB_USER:-eventos_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eventos_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-eventos_db}
      DB_USER: ${DB_USER:-eventos_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eventos.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
    ports:
      - "8080:8080"

volumes:
  eventos_mysql_data:
