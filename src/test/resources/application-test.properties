# Perfil "test": se activa con SPRING_PROFILES_ACTIVE=test (o con @ActiveProfiles("test") en los tests).
# Spring lee primero application.properties y DESPUES este archivo; lo que se repite aqui
# reemplaza al valor de application.properties. Asi los tests no necesitan MySQL ni la nube.

# Base H2 en memoria: se crea al iniciar los tests y desaparece al terminar.
spring.datasource.url=jdbc:h2:mem:eventos_tests;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# IMPORTANTE: application.properties fija el dialecto de MySQL; aqui lo cambiamos al de H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Crea las tablas desde cero en cada ejecucion y las borra al final.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Admin de prueba (AdminBootstrap lo crea al arrancar).
app.admin.email=admin@test.com
app.admin.password=AdminTest123
app.admin.nombre=Admin Test
