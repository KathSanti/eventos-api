# Perfil de produccion: se activa con SPRING_PROFILES_ACTIVE=prod
#
# A diferencia de application.properties, aqui NINGUNA variable tiene un
# valor por defecto. Si falta alguna (DB_HOST, DB_PASSWORD, ADMIN_PASSWORD...)
# la app falla al arrancar en vez de usar silenciosamente una clave de
# desarrollo como "Admin1234!". Todas estas variables deben llegar como
# secretos reales (ej. GitHub Actions Secrets -> variables de entorno del
# contenedor en AWS).

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nombre=${ADMIN_NOMBRE}
