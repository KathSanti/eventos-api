spring.application.name=eventos-api
server.port=8080

# ---------------------------------------------------------------------------
# CONFIGURACION ACTUAL: MySQL (local, temporal)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventos_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# Seguridad: cuenta de administrador creada automáticamente al arrancar si
# todavía no existe ningún usuario con rol ADMINISTRADOR. Solo para
# desarrollo/pruebas; en un entorno real cambia estos valores por variables
# de entorno reales y no dejes la contraseña por defecto.
# ---------------------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@eventos.com}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}

