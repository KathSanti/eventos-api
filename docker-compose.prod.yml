# ---------------------------------------------------------------------------
# docker-compose.prod.yml  ->  SOLO para la EC2 de la APP (produccion)
#
# La base de datos NO esta aqui: vive en otra EC2 (ver docker-compose.db.yml).
# La app se conecta a ella usando su IP PRIVADA (secreto DB_HOST).
#
# - La imagen se descarga de Docker Hub (la publica GitHub Actions).
# - Activa el perfil "prod" (application-prod.properties).
# - ${VAR:?mensaje} -> si falta la variable, compose se detiene con ese mensaje.
#
# Uso en la EC2 (lo hace el workflow):  docker compose -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------

services:
  app:
    image: ${DOCKERHUB_USERNAME:?Falta DOCKERHUB_USERNAME}/${IMAGE_NAME:?Falta IMAGE_NAME}:latest
    container_name: eventos-api
    restart: unless-stopped        # si la base aun no responde y la app se cae, Docker la reintenta
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?Falta DB_HOST}   # IP privada de la EC2 de la base (ej. 172.31.x.x)
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Falta DB_NAME}
      DB_USER: ${DB_USER:?Falta DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:?Falta ADMIN_NOMBRE}
      # Ahora Java tiene la instancia para el solo (1 GB en t4g.micro)
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    ports:
      - "80:8080"                  # internet:80  ->  contenedor:8080
